<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Judging Presentations</title>
<!--
  Rooted Warriors — judging script for the Nov 21, 2026 Regional Tournament.
  Built Nov 13 from the Engineering Notebook (updates/*.md, DECISIONS.md, 06-missions-bioglow.md).
  Nov 15: words replaced with the team's own hand edits; Show + Notes rewritten to match them.
  Order follows 00-judging-rubric.md exactly: IDENTIFY → DESIGN → CREATE → ITERATE → COMMUNICATE, row by row.
  Photos come from ../app/images/. Works offline: double-click to open. Print for paper scripts.
-->
<style>
:root{
  --forest:#1c3b2a; --pine:#2a5c3f; --grass:#3f9b4c;
  --lavender:#b48fd9; --lilac:#d9c6ee; --teal:#20b5c9;
  --cream:#f4efe1; --paper:#ffffff; --ink:#22301f; --dim:#6b7864; --line:#e5decb; --soft:#efe9d8;
  --fill:#fff1b8; --fillink:#6b4b00;
  --thea:#b48fd9; --fynn:#ffd84d; --isla:#e0453a; --adeline:#f9a8d4; --nolan:#20b5c9; --weston:#3f9b4c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Avenir Next','Trebuchet MS',sans-serif;background:var(--cream);color:var(--ink);line-height:1.45}
header{background:var(--forest);color:var(--cream);padding:18px 20px 0}
header .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
header img{width:58px;height:58px}
header h1{font-size:24px;font-weight:800}
header p{font-size:13px;color:var(--lilac)}
nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1000px;margin:14px auto 0}
nav button{border:none;background:var(--pine);color:var(--cream);font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer}
nav button.on{background:var(--cream);color:var(--forest)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.view{display:none}.view.on{display:block}
.intro{background:var(--paper);border:2px solid var(--lilac);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:14px}
.intro b{color:var(--forest)}
.total{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0}
.pill{background:var(--soft);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700}
.pill.ok{background:#d8f0dc;color:#1d5c2b}.pill.warn{background:#ffe3c2;color:#7a3d00}
.phase{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phase h2{font-size:18px;color:var(--forest);letter-spacing:1px}
.phase span{font-size:13px;color:var(--dim)}
.seg{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--c,#999);border-radius:12px;padding:14px 16px;margin-bottom:12px;break-inside:avoid}
.seghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid var(--c);background:var(--soft)}
.who{font-weight:800;font-size:17px}
.row{font-size:13px;color:var(--dim)}
.row b{color:var(--forest)}
.gear{font-size:11px;background:var(--lilac);color:var(--forest);padding:2px 8px;border-radius:10px;font-weight:700;margin-left:4px}
.secs{margin-left:auto;font-size:13px;font-weight:700;color:var(--pine);white-space:nowrap}
.goal{font-size:12px;color:var(--dim);margin:8px 0 6px;font-style:italic}
.say{font-size:17px;margin:6px 0}
.say p{margin:0 0 6px}
.fill{background:var(--fill);color:var(--fillink);padding:1px 6px;border-radius:6px;font-weight:700;border:1px dashed #d2a400}
.show{font-size:13px;margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.show b{color:var(--pine)}
.show img{height:70px;border-radius:8px;border:1px solid var(--line)}
.check{font-size:12px;margin-top:8px;background:#fff6e0;border-radius:8px;padding:6px 10px;color:#6b4b00}
table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--forest);color:var(--cream);font-size:13px}
td.n{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:12px;border-radius:6px;background:var(--c)}
.barwrap{background:var(--soft);border-radius:6px;width:100%;min-width:80px}
h3{color:var(--forest);margin:22px 0 8px}
ul.todo{background:var(--paper);border-radius:12px;padding:12px 16px 12px 34px;font-size:14px}
ul.todo li{margin:6px 0}
/* practice mode */
.prac{background:var(--forest);color:var(--cream);border-radius:16px;padding:18px;text-align:center}
.prac select,.prac button{font:inherit;font-size:15px;padding:8px 14px;border-radius:10px;border:none;margin:4px;cursor:pointer}
.prac button{background:var(--lavender);color:var(--forest);font-weight:800}
.clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal);margin:8px 0}
.clock.over{color:#ff8a7a}
.now{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;margin-top:12px;text-align:left;border-left:10px solid var(--c,#999)}
.now .who{font-size:22px}
.now .say{font-size:20px}
.segclock{font-size:14px;color:var(--lilac);margin-top:4px}
@media (max-width:600px){.say{font-size:16px}.clock{font-size:48px}.show img{height:56px}}
@media print{
  header nav,.noprint,#practice{display:none!important}
  body{background:#fff}
  .view{display:block!important}
  .view#fair{page-break-before:always}
  .seg{border:1px solid #bbb;border-left:8px solid var(--c)}
  .show img{display:none}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <img id="logo" src="../mockups/rooted-warriors-logo-transparent.png" alt="" onerror="this.style.display='none'">
    <div>
      <h1>Rooted Warriors · Judging Presentations</h1>
      <p>Regional Tournament Nov 21, 2026 · Innovation Project 5 min · Robot Design 5 min · in the judges' rubric order</p>
    </div>
  </div>
  <nav>
    <button data-v="ip" class="on">🌲 Innovation Project</button>
    <button data-v="rd">🤖 Robot Design</button>
    <button data-v="fair">⚖️ Who Says How Much</button>
    <button data-v="practice">⏱ Practice Timer</button>
  </nav>
</header>
<main>
  <section class="view on" id="ip"></section>
  <section class="view" id="rd"></section>
  <section class="view" id="fair"></section>
  <section class="view" id="practice"></section>
</main>

<script>
const PEOPLE = {

// Opened from the team app (http://…/presentation): photos come from /images/ and the words from the app (live edits).
// Double-clicked from the folder: uses the copy of the talk saved in this file (Nov 13).
const FROM_APP = location.protocol.startsWith('http');
const IMG = n => (FROM_APP ? '/images/' : '../app/images/') + encodeURIComponent(n);
if (FROM_APP) document.getElementById('logo').src = '/logo-transparent.png';
const WPM = 130;           // a calm speaking speed
const TALK_SECONDS = 300;  // 5 minutes per presentation

// [[...]] = a blank the team fills in before presenting (shown in yellow).
// Every fact below comes from the Engineering Notebook; "check" notes say where it's thin.
const TALKS = {
  "ip": {

      {
        "phase": "OPENING + IDENTIFY",

        "say": [
          "Hi! We are the Rooted Warriors from Flagstaff, Arizona.",
          "Before we start, let me introduce you to our Season App. We documented every part of the process in this interactive Engineering Notebook. Feel free to follow along as we go. Now for our Innovation Project:",
          "Imagine driving on I-17 at night when an elk steps onto the road. We learned that I-17 has about 300 animal strikes a year. That is almost one crash every single day. A new 21-million-dollar wildlife bridge at Willard Springs should cut those crashes by 90 percent. But will it work and is it worth the cost? We explored several options to help solve this problem."
        ],
        "show": "Whole team in a line, trifold behind you · Hand the judges the tablet or laptop with the Season App open on the Dashboard (\"follow along\") · then point to the Problem section of the trifold (in the app: Innovation Project → The Problem).",
        "photo": [],
        "check": "The bridge cost is $21 million, ADOT's current number (it may go up to $24 million later). Open the app on the Dashboard before you walk in, so handing it over takes 2 seconds."
      },
      {
        "phase": "IDENTIFY + DESIGN",
        "row": "Research + Project plan",
        "goal": "Clear, detailed research from a variety of sources · Clear evidence of an effective project plan",
        "gear": true,
        "speaker": "Adeline",
        "say": [
          "We used a variety of experts and resources when approaching this problem. We had 3 different ideas to help. First we considered a system that would alert drivers to animals using a camera or sensor and a flashing light. Next we considered a camera in a car that could alert a driver to an animal. Finally we considered a camera that would help track how many animals used the bridge vs other crossing locations.",
          "We interviewed an expert, Nate Ragan. He said Game and Fish uses expensive GPS collars to track animal movement. We researched what other communities have done to solve this problem. In Banff, Canada, 44 wildlife crossings cut crashes with big animals by more than 80 percent. But the Los Angeles Times reported that just building a crossing doesn't mean animals will use it, so in places like Nepal, scientists use camera traps to check.",
          "Ultimately we decided to build a multi-purpose camera that could detect animals then apply to all 3 solutions starting with tracking animals crossing the new bridge and compare results. We started by making a project plan as a Gantt chart in our team app. Every task has an owner and dates, from picking the design to practicing this talk."
        ],

        "photo": [],
        "check": "The Banff and Nepal facts come from Nolan's research (Think Wildlife Foundation, WWF, Los Angeles Times), all in Research Collection, so a judge can see the sources. The 3 ideas (warning light, in-car camera, bridge camera) aren't written in the notebook yet: add a dated entry."

      },
      {

        "gear": false,
        "speaker": "Nolan",
        "say": [

        ],

      {

      {

        "row": "Pride & enthusiasm + Next steps + thank you",

      }
    ]
  },
  "rd": {
    "title": "Robot Design",
    "icon": "🤖",
    "intro": "This is your robot game talk. The judges score it with the Robot Design rubric, row by row, in this exact order. Each student talks once and covers two rubric rows in a row, so there are only 5 hand-offs. Have the robot, the attachments and a laptop with the code ready.",

      {
        "phase": "OPENING + IDENTIFY",

        "speaker": "Isla",
        "say": [
          "This is our robot! Our mission strategy this year started with a robot base. We wanted to balance speed and accuracy. We started by testing 8 different wheels. We decided on this one because it has good traction and is accurate. Next we decided on size. Our robot is low and wide with extra bracing, so it doesn't tip and it turns accurately.",

const ROWS_NOTE = {
  'IDENTIFY':'Team had a clearly defined problem / mission strategy',
  'DESIGN':'Team worked together and planned',
  'CREATE':'What we built and why it is new',
  'ITERATE':'Shared, tested, improved',
  'COMMUNICATE':'Explain + show pride',
  'OPENING':'Before the rubric rows',
  'CLOSING':'Last 20 seconds'
};

const clean = s => s.replace(/\(Everyone[^)]*\)\s*/,'').replace(/\(Everyone says[^)]*\)/,'').replace(/\[\[|\]\]/g,'');
function words(seg){
  // blanks count as ~8 words so the timing stays honest
  let n = 0;
  seg.say.forEach(line=>{
    if(/^\(Everyone says/.test(line)){ return; }
    const blanks = (line.match(/\[\[[^\]]*\]\]/g)||[]).length;
    const t = line.replace(/\[\[[^\]]*\]\]/g,'').replace(/\(Everyone:?\)/,'').trim();
    n += (t ? t.split(/\s+/).length : 0) + blanks*8;
  });
  return n;
}
const secs = w => Math.round(w/WPM*60);
const mmss = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const fmt = line => line.replace(/\[\[([^\]]*)\]\]/g,'<span class="fill">✏️ $1</span>');

function avatar(name){ return `<img class="avatar" src="${IMG('profile '+name.toLowerCase()+'.jpg')}" alt="${name}" onerror="this.style.visibility='hidden'">`; }

function renderTalk(key){
  const t = TALKS[key];
  const total = t.segs.reduce((a,s)=>a+secs(words(s)),0);
  const handoffs = (t.segs.length-1)*3;
  const all = total+handoffs;
  let h = `<div class="intro"><b>${t.icon} ${t.title} · 5 minutes.</b> ${t.intro}
    <div class="total"><span class="pill">Talking ≈ ${mmss(total)}</span><span class="pill">+ hand-offs ≈ ${mmss(handoffs)}</span>
    <span class="pill ${all<=270?'ok':'warn'}">Total ≈ ${mmss(all)} · goal 5:00 ${all<=270?'✓ room to breathe':'· time a real practice and adjust'}</span></div>
    <div style="margin-top:8px;font-size:13px">⚙️ = this row also counts for <b>Core Values</b>. <span class="fill">✏️ yellow</span> = fill in before you present. 📝 = fix or check in the script or the Season App.</div></div>`;
  let last = '';
  t.segs.forEach((s,i)=>{
    if(s.phase!==last){ h += `<div class="phase"><h2>${s.phase}</h2><span>${ROWS_NOTE[s.phase]||''}</span></div>`; last = s.phase; }
    const w = words(s);
    h += `<div class="seg" style="--c:${PEOPLE[s.speaker].c}">
      <div class="seghead">${avatar(s.speaker)}<div><div class="who">${s.speaker}</div>
      <div class="row">${i+1}. <b>${s.row}</b>${s.gear?'<span class="gear">⚙️ Core Values</span>':''}</div></div>
      <div class="secs">~${secs(w)} s · ${w} words</div></div>
      ${s.goal?`<div class="goal">Judges want: "${s.goal}"</div>`:''}
      <div class="say">${s.say.map(l=>`<p>${fmt(l)}</p>`).join('')}</div>
      <div class="show"><b>Show:</b> ${s.show}${(s.photo||[]).map(p=>`<img src="${IMG(p)}" alt="">`).join('')}</div>
      ${s.check?`<div class="check">📝 ${s.check}</div>`:''}
    </div>`;
  });
  document.getElementById(key).innerHTML = h;
}

function renderFair(){
  const names = Object.keys(PEOPLE);
  const tally = {}; names.forEach(n=>tally[n]={ip:0,rd:0,parts:[]});
  ['ip','rd'].forEach(k=>TALKS[k].segs.forEach(s=>{ tally[s.speaker][k]+=words(s); tally[s.speaker].parts.push((k==='ip'?'🌲 ':'🤖 ')+s.row); }));
  const max = Math.max(...names.map(n=>tally[n].ip+tally[n].rd));
  let h = `<div class="intro"><b>⚖️ Everyone says about the same amount.</b> Each teammate talks <b>once in each talk</b>: one paragraph that covers two rubric rows in a row. Word counts update by themselves if the script changes.</div>
  <table><tr><th>Who</th><th>🌲 Innovation</th><th>🤖 Robot Design</th><th>Total</th><th style="width:30%"></th></tr>`;
  names.forEach(n=>{
    const t = tally[n], tot = t.ip+t.rd;
    h += `<tr><td><b>${n}</b></td><td class="n">${t.ip} words · ~${secs(t.ip)} s</td><td class="n">${t.rd} words · ~${secs(t.rd)} s</td>
      <td class="n">${tot}</td><td><div class="barwrap"><div class="bar" style="--c:${PEOPLE[n].c};width:${Math.round(tot/max*100)}%"></div></div></td></tr>`;
  });
  h += `</table><h3>Each person's parts</h3><table><tr><th>Who</th><th>Parts (in order)</th></tr>`;
  names.forEach(n=>{ h += `<tr><td><b>${n}</b></td><td>${tally[n].parts.join(' · ')}</td></tr>`; });
  h += `</table><h3>📝 Fix or check before you present</h3><ul class="todo">`;
  ['ip','rd'].forEach(k=>TALKS[k].segs.forEach(s=>{ if(s.check) h += `<li><b>${TALKS[k].icon} ${s.row} (${s.speaker}):</b> ${s.check}</li>`; }));
  h += `</ul><h3>Tips from the rubric</h3><ul class="todo">
    <li>Judges must tick a box on <b>every row</b>, in this order. If a row is skipped, they have nothing to tick.</li>
    <li><b>Show, don't just tell.</b> Hold up the camera, the robot, the attachments, the timing notes.</li>
    <li>"Exceeds" needs something the judges want to write down. Your camera → Pi → AI system working on Nov 9 is a great one.</li>
    <li>Hand off by name: "Now Fynn will tell you about our research." It keeps the talk moving and shows teamwork.</li>
    <li>After 5 minutes, judges ask questions. Anyone can answer, and it's fine to say "Let me show you" and point at the app.</li>
  </ul>`;
  document.getElementById('fair').innerHTML = h;
}

// ---- practice timer ----
let P = {talk:'ip', i:0, start:0, segStart:0, timer:null};
function renderPractice(){
  const t = TALKS[P.talk], s = t.segs[P.i];
  const target = secs(words(s));
  document.getElementById('practice').innerHTML = `<div class="prac">
    <div><select id="ptalk"><option value="ip">🌲 Innovation Project</option><option value="rd">🤖 Robot Design</option></select>
    <button id="pgo">${P.timer?'⏸ Stop':'▶ Start'}</button><button id="pback">◀ Back</button><button id="pnext">Next ▶</button><button id="preset">↺ Reset</button></div>
    <div class="clock" id="pclock">0:00</div><div class="segclock" id="pseg"></div>
    <div class="now" style="--c:${PEOPLE[s.speaker].c}"><div class="seghead">${avatar(s.speaker)}<div><div class="who">${s.speaker}</div>
      <div class="row">Part ${P.i+1} of ${t.segs.length} · <b>${s.phase} · ${s.row}</b> · aim for ~${target} s</div></div></div>
      <div class="say">${s.say.map(l=>`<p>${fmt(l)}</p>`).join('')}</div>
      <div class="show"><b>Show:</b> ${s.show}</div></div>
    <p style="font-size:13px;margin-top:10px;color:var(--lilac)">Tap <b>Next</b> (or press the space bar) when the next speaker starts. The big clock turns red after 5:00.</p></div>`;
  document.getElementById('ptalk').value = P.talk;
  document.getElementById('ptalk').onchange = e=>{ stop(); P={talk:e.target.value,i:0,start:0,segStart:0,timer:null}; renderPractice(); };
  document.getElementById('pgo').onclick = ()=>{ P.timer?stop():go(); renderPractice(); };
  document.getElementById('pnext').onclick = next;
  document.getElementById('pback').onclick = ()=>{ if(P.i>0){P.i--; P.segStart=Date.now(); renderPractice();} };
  document.getElementById('preset').onclick = ()=>{ stop(); P.i=0; P.start=0; renderPractice(); };
  tick();
}
function go(){ const now=Date.now(); if(!P.start){P.start=now;} P.segStart=P.segStart||now; P.timer=setInterval(tick,250); }
function stop(){ clearInterval(P.timer); P.timer=null; }
function next(){ const n=TALKS[P.talk].segs.length; if(P.i<n-1){P.i++; P.segStart=Date.now(); renderPractice();} else { stop(); renderPractice(); } }
function tick(){
  const c=document.getElementById('pclock'); if(!c) return;
  const e = P.start? Math.floor((Date.now()-P.start)/1000):0;
  c.textContent = mmss(e); c.className = 'clock'+(e>TALK_SECONDS?' over':'');
  const se = P.segStart&&P.start? Math.floor((Date.now()-P.segStart)/1000):0;
  document.getElementById('pseg').textContent = P.start? 'This part: '+mmss(se):'Press Start when the first speaker begins';
}
document.addEventListener('keydown',e=>{ if(e.code==='Space' && document.getElementById('practice').classList.contains('on')){ e.preventDefault(); if(!P.timer){go();renderPractice();} else next(); }});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v));
  if(b.dataset.v==='practice') renderPractice();
});
function renderEverything(){ renderTalk('ip'); renderTalk('rd'); renderFair(); renderPractice(); }
renderEverything();
if (FROM_APP) fetch('/api/data').then(r=>r.json()).then(d=>{
  const rows = d.talk_parts || []; if (!rows.length) return;
  for (const k of ['ip','rd']) {
    const ps = rows.filter(r=>r.talk===k).sort((a,b)=>a.n-b.n);
    if (ps.length) TALKS[k].segs = ps.map(r=>({phase:r.ph, row:r.row, goal:r.goal, gear:!!r.cv, speaker:r.who, say:r.say, show:r.show, photo:r.photos||[], check:r.check}));
  }
  P.i = 0; renderEverything();
  document.querySelector('header p').insertAdjacentHTML('beforeend',' · <b>live from the team app</b>');
}).catch(()=>{});
</script>
